[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragnav"
version = "0.6.1"
description = "Hybrid structure-aware retrieval — BM25 + embeddings + document graph expansion. Runs fully offline, no API key required."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Irfan Ali", email = "irfanali29@hotmail.com" }]
keywords = [
  "rag",
  "retrieval",
  "pdf",
  "papers",
  "graphrag",
  "bm25",
  "hybrid-search",
  "embeddings",
  "sentence-transformers",
  "offline",
  "vectorless-rag",
  "document-graph",
  "reranking",
  "citations",
  "llm",
  "information-retrieval",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: OS Independent",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
  "numpy>=1.26.0",
  "rank-bm25>=0.2.2",
]

[project.urls]
Homepage = "https://github.com/irfanalidv/RAGNav"
Documentation = "https://github.com/irfanalidv/RAGNav#readme"
Repository = "https://github.com/irfanalidv/RAGNav"
Issues = "https://github.com/irfanalidv/RAGNav/issues"
Changelog = "https://github.com/irfanalidv/RAGNav/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mistral = [
  "mistralai>=1.9.0",
  "python-dotenv>=1.0.1",
]
pdf = [
  "pymupdf>=1.26.0",
  "requests>=2.31.0",
]
messy = [
  "beautifulsoup4>=4.12.0",
]
embeddings = [
  "sentence-transformers>=3.0.0",
]
reranking = [
  "sentence-transformers>=3.0.0",
]
# mistralai excluded from `all` — paid API client; install with: pip install ragnav[mistral]
all = [
  "numpy>=1.26.0",
  "rank-bm25>=0.2.2",
  "pymupdf>=1.26.0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "sentence-transformers>=3.0.0",
  "datasets>=2.14.0",
]
dev = [
  "pillow>=10.0.0",
  "ruff>=0.6.0",
  "mypy>=1.10.0",
  "build>=1.2.0",
  "twine>=5.0.0",
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "sentence-transformers>=3.0.0",
  "datasets>=2.14.0",
]

[project.scripts]
ragnav = "ragnav.cli:main"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  ".venv_pypi",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RUF", "PTH", "RET", "PIE"]

[tool.ruff.lint.flake8-bugbear]
# Frozen config dataclasses: a shared default instance cannot be mutated, so using one
# as an argument / field default is safe.
extend-immutable-calls = [
  "ragnav.graphrag.extract.EntityExtractConfig",
  "ragnav.graphrag.retriever.EntityGraphRetrieverConfig",
  "ragnav.papers.rag.PaperRAGConfig",
  "ragnav.pipelines.agentic.AgenticConfig",
  "ragnav.pipelines.agentic_pdf.AgenticPdfConfig",
  "ragnav.pipelines.hybrid.HybridRagConfig",
  "ragnav.pipelines.vectorless.VectorlessRagConfig",
]

[tool.ruff.lint.per-file-ignores]
# Benchmarks, examples and notebooks put the repo root on sys.path before importing
# ragnav, and print long human-readable result lines.
"benchmarks/*.py" = ["E402", "E501"]
"examples/**/*.py" = ["E402", "E501"]
"cookbook/*.ipynb" = ["E402", "E501", "SIM905"]  # str.split() word lists read better in demos

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
ragnav = ["py.typed"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ragnav*"]

[tool.mypy]
python_version = "3.10"
files = ["ragnav"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[tool.coverage.run]
source = ["ragnav"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
