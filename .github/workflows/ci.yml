name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  download-models:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1-${{ hashFiles('pyproject.toml') }}
      - name: Pre-download sentence-transformers models
        run: |
          uv venv
          uv pip install "sentence-transformers>=3.0.0"
          uv run --no-sync python - <<'PY'
          from sentence_transformers import CrossEncoder, SentenceTransformer

          SentenceTransformer("all-MiniLM-L6-v2")
          CrossEncoder("cross-encoder/ms-marco-MiniLM-L-6-v2")
          print("models cached")
          PY

  test:
    needs: download-models
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Restore Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-models-v1-${{ hashFiles('pyproject.toml') }}
      - name: Install package + dev, pdf and messy extras
        run: |
          uv venv
          uv pip install -e ".[dev,pdf,messy]"
      - name: Ruff lint
        run: uv run --no-sync ruff check .
      - name: Ruff format
        run: uv run --no-sync ruff format --check .
      - name: Mypy
        run: uv run --no-sync mypy ragnav
      - name: Tests + coverage
        env:
          HF_HUB_OFFLINE: "1"
        run: >
          uv run --no-sync pytest
          --cov=ragnav --cov-report=xml --cov-report=term-missing
          --cov-fail-under=85
      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
